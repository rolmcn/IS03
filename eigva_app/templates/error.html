{% extends "base-public.html" %}

{% block styles %}
<link href="/static/css/error.css" rel="stylesheet">
{% endblock %}

{% block main %}
<div class="main-error-container">

    <h4>
        {{ error_code }} – {{ error_title }}
    </h4>

    <p class="close-message">
        Po
        <span class="countdown">{{ countdown }}</span>
        sekundžių automatiškai būsite nukreipti į pirmą puslapį.
    </p>

</div>
{% endblock %}

{% block footer %}{% endblock %}
