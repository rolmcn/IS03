<!DOCTYPE html>
<html lang="lt">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EIGVA</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="{{ url_for('static', path='css/base-dashboard.css') }}" rel="stylesheet">
    <meta name="csrf-token" content="{{ csrf_token }}">

    {% block styles %}{% endblock %}
</head>

<body class="loading">
    <div id="loading-overlay">
        <div class="spinner"></div>
        <p id="loading-text">Vykdoma…</p>
    </div>

    <header class="main-header">
        <div class="header-container">
            <div class="info-block">
                <div class="info-icon-1">
                    <img src="/static/img/person_40dp_F0F0F0_FILL0_wght500_GRAD0_opsz40.svg" alt="Naudotojo piktograma - naudotojo duomenys">
                </div>
                <div class="info-user">
                    <p><strong>{{ current_user.first_name }} {{ current_user.last_name }}</strong></p>
                </div>
                <div class="info-icon-2">
                    <img src="/static/img/business_center_40dp_F0F0F0_FILL0_wght500_GRAD0_opsz40.svg" alt="Portfelio piktograma - sistemos duomenys">
                </div>
                <div class="info-system">
                    <p>EIGVA Auto v1.0</p>
                </div>
                <div class="info-icon-3">
                    <img src="/static/img/nest_clock_farsight_analog_40dp_F0F0F0_FILL0_wght500_GRAD0_opsz40.svg" alt="Laikrodžio piktograma - sistemos duomenys">
                </div>
                <div class="info-time">
                    <span id="clock"></span>
                </div>
            </div>
            <nav class="menu-block">
                <a href="/queue"
                    class="{{ 'active' if active_page == 'queue' else '' }}">
                    Eilė
                </a>
                <a href="/works"
                    class="{{ 'active' if active_page == 'works' else '' }}">
                    Darbai
                </a>
                <a href="/customers"
                    class="{{ 'active' if active_page == 'customers' else '' }}">
                    Klientai
                </a>
                <a href="/account"
                    class="{{ 'active' if active_page == 'account' else '' }}">
                    Paskyra
                </a>
            </nav>
            <div class="button-block">
                <a
                        class="question-mark-symbol"
                        href="/manual"
                        aria-label="Žinynas"
                        title="Žinynas"
                        translate="no">
                </a>
                <a
                        class="accessibility-symbol"
                        href="/accessibility-settings"
                        aria-label="Prieinamumo nustatymai"
                        title="Prieinamumo nustatymai"
                        translate="no">
                </a>
                <a
                        class="logout-symbol"
                        href="/logout"
                        aria-label="Atsijungti"
                        title="Atsijungti"
                        translate="no">
                </a>
            </div>
        </div>
        {% block header %}{% endblock %}
    </header>

    <main>
        {% block main %}{% endblock %}
    </main>

    <footer>
        {% block footer %}{% endblock %}
    </footer>

    <script src="/static/js/clock.js"></script>
    <script src="/static/js/flash-message.js"></script>
    <script src="/static/js/hide-spinner.js"></script>
    <script src="/static/js/manual.js"></script>
    <script src="/static/js/message-show.js"></script>
    <script src="/static/js/page-auto-close.js"></script>
    <script src="/static/js/page-auto-redirect.js"></script>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <script src="/static/js/reset-recaptcha.js"></script>
    <script src="/static/js/token-confirm.js"></script>

    <script>
      window.currentUser = {
        first_name: {{ current_user.first_name | tojson }},
        last_name: {{ current_user.last_name | tojson }},
        mobile_phone: {{ current_user.mobile_phone | tojson }},
        email: {{ current_user.email | tojson }}
      };

      window.currentPayer = {
        payer_type: {{ current_payer.payer_type | tojson }},
        full_name: {{ current_payer.full_name | tojson }},
        identification_code: {{ current_payer.identification_code | tojson }},
        vat_status: {{ current_payer.vat_status | tojson }},
        vat_code: {{ current_payer.vat_code | tojson }},
        street: {{ current_payer.street | tojson }},
        house_number: {{ current_payer.house_number | tojson }},
        apartment_number: {{ current_payer.apartment_number | tojson }},
        postal_code: {{ current_payer.postal_code | tojson }},
        settlement: {{ current_payer.settlement | tojson }},
        municipality: {{ current_payer.municipality | tojson }},
        country: {{ current_payer.country | tojson }},
        mobile_phone: {{ current_payer.mobile_phone | tojson }},
        email: {{ current_payer.email | tojson }}
      };

      window.scenario = {{ scenario | tojson }};
      window.fieldErrors = {{ field_errors | tojson if field_errors else '{}' }};
    </script>
    <script src="/static/js/payer-form-dynamic.js"></script>

</body>
</html>
